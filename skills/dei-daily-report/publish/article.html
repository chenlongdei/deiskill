<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --paper:#F2EDE2; --paper-2:#E8E1D2; --ink:#141414; --text:#26231f; --muted:#706a5f; --hair:rgba(20,20,20,.14);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --display:"Anton","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
[data-theme=red]   {--accent:#E43A2A;--on-accent:#141414;--accent-text:#C42D1D;--mark:rgba(228,58,42,.22)}
[data-theme=orange]{--accent:#F26A24;--on-accent:#141414;--accent-text:#C94E0F;--mark:rgba(242,106,36,.25)}
[data-theme=yellow]{--accent:#E8E23A;--on-accent:#141414;--accent-text:#141414;--mark:rgba(232,226,58,.6)}
[data-theme=blue]  {--accent:#2340D8;--on-accent:#F2EDE2;--accent-text:#2340D8;--mark:rgba(35,64,216,.16)}
[data-theme=green] {--accent:#3DE35C;--on-accent:#141414;--accent-text:#12843A;--mark:rgba(61,227,92,.35)}
[data-theme=pink]  {--accent:#EC3F8C;--on-accent:#141414;--accent-text:#C8226C;--mark:rgba(236,63,140,.2)}
[data-theme=mint]  {--accent:#A6D7BF;--on-accent:#141414;--accent-text:#1E7A55;--mark:rgba(166,215,191,.7)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto}

/* ============ 报头 ============ */
.hero{background:var(--accent);color:var(--on-accent);padding:28px 24px 30px}
.hero .bar{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.1em;border-top:2px solid currentColor;border-bottom:1px solid currentColor;padding:8px 0}
.hero h1{margin:20px 0 0;font-family:var(--serif);font-weight:900;font-size:76px;line-height:.95;letter-spacing:-.03em;display:flex;align-items:flex-end}
.hero h1 .sub{writing-mode:vertical-rl;font-size:22px;letter-spacing:.12em;line-height:1;background:var(--on-accent);color:var(--accent);padding:7px 5px;margin:0 0 5px 10px}
.hero .line{margin-top:16px;border-top:1px solid currentColor;border-bottom:2px solid currentColor;padding:8px 0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between}
.hero .hl{margin:30px 0 14px;font-weight:900;font-size:42px;line-height:1.22;letter-spacing:-.02em}
.hero .dek{margin:0;font-size:17px;line-height:1.8;font-weight:500;opacity:.92}
.toc{margin-top:26px;border-top:2px solid currentColor}
.toc a{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:baseline;padding:12px 0;border-bottom:1px solid currentColor;color:inherit;text-decoration:none}
.toc b{font-family:var(--display);font-weight:400;font-size:20px}
.toc span{font-size:17px;font-weight:700}
.toc em{grid-column:2 / 4;font-style:normal;font-size:14.5px;line-height:1.55;opacity:.85}
.toc small{font-family:var(--mono);font-size:11px;opacity:.75}
.note{margin:0;padding:18px 24px;background:var(--paper-2);font-size:13.5px;line-height:1.8;color:var(--muted)}

/* ============ 版块 ============ */
.mod{padding:46px 24px 30px;border-top:3px solid var(--ink);background:var(--paper)}
.mod-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:8px}
.mod-head h2{margin:0;font-family:var(--serif);font-weight:900;font-size:36px;line-height:1.2}
.mod-head .n{font-family:var(--display);font-size:64px;line-height:.85;color:var(--accent-text)}
.mod.top{background:var(--ink);color:#e9e4d9;border-top:0}
.mod.top .mod-head{border-color:rgba(242,237,226,.5)}
.mod.top .mod-head h2,.mod.top h3{color:var(--paper)}
.mod.top .mod-head .n{color:var(--accent)}
[data-theme=blue] .mod.top .mod-head .n{color:#7F93FF}
.mod.top strong{background:none;color:var(--paper);border-bottom:2px solid var(--accent)}
[data-theme=blue] .mod.top strong{border-color:#7F93FF}
.mod.top li::before{background:var(--accent)}
.mod.top .kicker{color:#cfc9bd}
.mod.src{padding-top:30px}
.mod.src .mod-head h2{font-size:22px}
.mod.src .mod-head .n{display:none}
.mod.src li{font-size:13.5px;line-height:1.75}
.mod.src a{color:var(--muted)}

h3{margin:36px 0 12px;font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.45;color:var(--ink);padding-left:14px;border-left:5px solid var(--accent)}
p{margin:0 0 16px;font-size:17px;line-height:1.9;text-align:justify}
strong{font-weight:700;color:var(--ink);background:linear-gradient(transparent 60%,var(--mark) 60%)}
ul,ol{margin:0 0 18px;padding:0;list-style:none}
li{position:relative;padding-left:20px;font-size:16.5px;line-height:1.85;margin:6px 0}
li::before{content:"";position:absolute;left:2px;top:.78em;width:7px;height:7px;background:var(--ink)}
blockquote{margin:0 0 18px;padding:14px 18px;background:var(--paper-2);border-left:4px solid var(--accent);font-size:15px;color:var(--muted)}
blockquote p{font-size:15px;margin:0}
hr{display:none}
a{color:var(--accent-text);text-decoration-thickness:1px;text-underline-offset:3px}
.tbl{margin:6px 0 22px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.6}
th{text-align:left;font-family:var(--mono);font-size:12px;letter-spacing:.06em;font-weight:700;padding:9px 10px 8px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top}
td:first-child{font-weight:700;white-space:nowrap}
.mod.top th{border-color:rgba(242,237,226,.6)}
.mod.top td{border-color:rgba(242,237,226,.15)}

/* 结尾 */
.sign{background:var(--ink);color:var(--paper);padding:34px 24px 40px;display:flex;justify-content:space-between;align-items:flex-end}
.sign .m{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1}
.sign .m small{font-size:15px;margin-left:8px;padding:3px 6px;background:var(--accent);color:var(--on-accent);vertical-align:middle}
.sign .r{font-family:var(--mono);font-size:11px;opacity:.6;text-align:right;line-height:1.7}

@media (min-width:700px){
  body{background:#2a2925}
  .wrap{box-shadow:0 0 60px rgba(0,0,0,.4)}
  .hero{padding:40px 44px 40px}.mod{padding-left:44px;padding-right:44px}.note{padding-left:44px;padding-right:44px}.sign{padding-left:44px;padding-right:44px}
  .hero h1{font-size:96px}.hero .hl{font-size:52px}
}
body.export{background:var(--paper)}
body.export .wrap{box-shadow:none}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>window.REPORT = /*__REPORT__*/null;</script>
<script type="text/markdown" id="md">/*__MD__*/</script>
<script>
(function(){
const R = window.REPORT;
const wrap = document.getElementById("wrap");
if (R) document.title = (R.brand||"")+"日报 · "+R.date;
if (!R){ wrap.innerHTML = '<p style="padding:60px 24px">这是空模板，请打开 output/期号/长文.html 查看成品。</p>'; return; }
const THEMES=["red","orange","yellow","blue","green","pink","mint"];
const qs=new URLSearchParams(location.search);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
(function(){ const t=qs.get("theme")||R.theme; if(THEMES.includes(t)) return document.documentElement.dataset.theme=t;
  const m=/(\d+)\s*年\s*(\d+)\s*月\s*(\d+)/.exec(R.date); const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date();
  document.documentElement.dataset.theme=THEMES[(d.getDay()+6)%7]; })();
if (qs.has("export")) document.body.classList.add("export");

// 1. markdown → html
let md = document.getElementById("md").textContent;
md = md.replace(/^# .*\n/, "");                       // 标题由报头接管
let note = "";
md = md.replace(/^\s*>\s*(.+)\n/, (_,t)=>{ note=t; return ""; });   // 首段引言变成说明条
const tmp = document.createElement("div");
tmp.innerHTML = marked.parse(md);

// 2. 按 H2 切成版块
const mods=[]; let cur=null;
[...tmp.childNodes].forEach(n=>{
  if(n.nodeName==="H2"){ cur={title:n.textContent.replace(/^[一二三四五六七八九十]+、/,"").trim(),nodes:[]}; mods.push(cur); }
  else if(cur) cur.nodes.push(n);
});
let num=0;
const modHtml = mods.map((m,i)=>{
  const isSrc=/资料来源/.test(m.title), isTop=i===0;
  const n = isSrc? "" : pad(num++);
  const box=document.createElement("div"); m.nodes.forEach(x=>box.appendChild(x));
  box.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tbl";t.replaceWith(w);w.appendChild(t);});
  box.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener";});
  m.id=`m${i}`; m.n=n; m.chars=box.textContent.replace(/\s/g,"").length;
  return `<section class="mod ${isTop?"top":""} ${isSrc?"src":""}" id="${m.id}"><div class="mod-head"><h2>${esc(m.title)}</h2><span class="n">${n}</span></div>${box.innerHTML}</section>`;
}).join("");

// 3. 报头 + 目录
const toc = mods.filter(m=>m.n!=="").map((m,i)=>`<a href="#${m.id}"><b>${m.n}</b><span>${esc(m.title)}</span><small>${Math.max(1,Math.round(m.chars/450))} 分钟</small>${R.toc&&R.toc[i]?`<em>${esc(R.toc[i])}</em>`:""}</a>`).join("");
const hero = `<header class="hero" id="hero">
  <div class="bar"><span>${esc(R.date)} ${esc(R.weekday)}</span><span>第 ${String(R.issue).padStart(3,"0")} 期</span></div>
  <h1>${esc(R.brand||"")}<span class="sub">日报</span></h1>
  <div class="line"><span>${esc(R.read)}</span></div>
  <div class="hl">${R.headline.map(esc).join("<br>")}</div>
  <p class="dek">${esc(R.dek)}</p>
  <nav class="toc">${toc}</nav>
</header>${note?`<p class="note">${esc(note)}</p>`:""}`;
const sign = `<footer class="sign"><div class="m">${esc(R.brand||"")}<small>日报</small></div><div class="r">第 ${String(R.issue).padStart(3,"0")} 期<br>${esc(R.date)}</div></footer>`;
wrap.innerHTML = hero + modHtml + sign;
document.fonts.ready.then(()=>{ window.__ready=true; });
})();
</script>
</body>
</html>
